    <!--
      GitHub Pages SPA redirect strategy:
      Saves the current URL to sessionStorage and redirects to the root,
      where the React app picks it up and handles the route.
      For this portfolio (single-page, anchor-based navigation),
      this simply redirects any unknown path to the homepage.
    -->
    <script>
      // User site (andersonmdn.github.io) — always redirect to root.
      window.location.replace('/')
    </script>
